openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API publique de NovaLuth
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: directory
    description: Public directory of makers
  - name: recommendations
    description: Instrument matching engine
  - name: briefs
    description: Musician project briefs
  - name: admin
    description: Moderation and curation
  - name: atelier-access
    description: Atelier access requests and musician project decisions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /fiches:
    get:
      operationId: listFiches
      tags: [directory]
      summary: List published makers
      parameters:
        - name: pays
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [luthier, marque_emergente]
        - name: innovation_min
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 10
            default: 0
        - name: statut
          in: query
          required: false
          schema:
            type: string
            enum: [publiee, candidate, a_verifier, a_suivre, trop_etablie, rejetee]
            default: publiee
      responses:
        "200":
          description: Matching directory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fiche"
  /fiches/meta:
    get:
      operationId: getFichesMeta
      tags: [directory]
      summary: Get directory summary and available filters
      responses:
        "200":
          description: Directory summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FichesMeta"
  /fiches/{slug}:
    get:
      operationId: getFiche
      tags: [directory]
      summary: Get one published maker
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Maker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fiche"
        "404":
          description: Maker not found
  /recommend:
    post:
      operationId: recommend
      tags: [recommendations]
      summary: Match a musician brief with published makers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefInput"
      responses:
        "200":
          description: Recommendations with explanations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "422":
          description: Invalid brief
  /briefs:
    post:
      operationId: createBrief
      tags: [briefs]
      summary: Save a musician project brief without sharing it unless consent is explicit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefInput"
      responses:
        "201":
          description: Brief saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefReceipt"
        "422":
          description: Invalid brief
        "400":
          description: A consented project requires an email address for its private portal
  /projets/{reference}/portail/{token}:
    get:
      operationId: getMusicianProject
      tags: [atelier-access]
      summary: Get a musician project using its private portal link
      parameters:
        - $ref: "#/components/parameters/ProjectReference"
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Musician project and access requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicianProject"
        "404":
          description: Project or private link not found
  /projets/{reference}/portail/{token}/demandes/{requestId}/decision:
    post:
      operationId: decideMusicianAccessRequest
      tags: [atelier-access]
      summary: Accept or refuse an atelier access request
      description: >
        Only the musician holding the private portal link can decide. An accepted request
        captures its preauthorization and opens a five-day access pass; a refusal releases it.
      parameters:
        - $ref: "#/components/parameters/ProjectReference"
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: requestId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MusicianDecisionInput"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAccessRequest"
        "404":
          description: Project or request not found
        "409":
          description: Request was already decided
  /ateliers/{slug}/session:
    post:
      operationId: openAtelierSession
      tags: [atelier-access]
      summary: Open a limited demonstration session for an atelier
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierSessionInput"
      responses:
        "200":
          description: Limited atelier session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierSession"
        "404":
          description: Atelier not found
  /ateliers/{slug}/tableau-de-bord:
    get:
      operationId: getAtelierDashboard
      tags: [atelier-access]
      summary: Get atelier requests, credits and access passes
      security:
        - atelierSession: []
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
      responses:
        "200":
          description: Atelier dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierDashboard"
        "401":
          description: Invalid session
  /ateliers/{slug}/projets:
    get:
      operationId: listAtelierProjects
      tags: [atelier-access]
      summary: List compatible projects available to an atelier
      security:
        - atelierSession: []
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
      responses:
        "200":
          description: Compatible musician projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierProject"
        "401":
          description: Invalid session
  /ateliers/{slug}/demandes:
    post:
      operationId: createAtelierAccessRequest
      tags: [atelier-access]
      summary: Request access to a compatible musician project
      description: >
        Creates a pending request with a payment preauthorization only. Project details stay
        hidden until the musician accepts. An atelier may hold at most three pending requests
        or active access passes.
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierAccessRequestInput"
      responses:
        "201":
          description: Preauthorized access request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAccessRequest"
        "400":
          description: Request cannot be created
  /ateliers/{slug}/demandes/{requestId}/annulation:
    post:
      operationId: cancelAtelierAccessRequest
      tags: [atelier-access]
      summary: Cancel a pending request and release its authorization
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
        - name: requestId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierActionInput"
      responses:
        "200":
          description: Cancelled request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAccessRequest"
  /ateliers/{slug}/carnets/{requestId}/relance:
    post:
      operationId: useAtelierFollowupCredit
      tags: [atelier-access]
      summary: Use one follow-up credit on an active, captured access pass
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
        - name: requestId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierActionInput"
      responses:
        "200":
          description: Updated access pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAccessRequest"
        "400":
          description: Access has expired, has not been accepted, or has no remaining credit
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get moderation queue summary
      security:
        - adminToken: []
      responses:
        "200":
          description: Moderation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          description: Missing or invalid admin token
  /admin/fiches/{slug}/status:
    patch:
      operationId: updateFicheStatus
      tags: [admin]
      summary: Change a maker profile status
      security:
        - adminToken: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fiche"
        "401":
          description: Missing or invalid admin token
        "404":
          description: Maker not found
  /admin/acces/entretien:
    post:
      operationId: runAccessMaintenance
      tags: [admin]
      summary: Run the daily access expiration and reminder maintenance
      security:
        - adminToken: []
      responses:
        "200":
          description: Maintenance results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessMaintenanceResult"
        "401":
          description: Missing or invalid admin token
components:
  parameters:
    AtelierSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    ProjectReference:
      name: reference
      in: path
      required: true
      schema: { type: string }
  securitySchemes:
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
    atelierSession:
      type: apiKey
      in: header
      name: X-NovaLuth-Atelier-Session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Specification:
      type: object
      properties:
        bois_corps: { type: ["string", "null"] }
        bois_manche: { type: ["string", "null"] }
        touche: { type: ["string", "null"] }
        profil_manche: { type: ["string", "null"] }
        diapason_mm: { type: ["number", "null"] }
        nombre_cases: { type: ["number", "null"] }
        type_micros: { type: ["string", "null"] }
        configuration_micros: { type: ["string", "null"] }
        chevalet: { type: ["string", "null"] }
        poids_kg: { type: ["number", "null"] }
    Modele:
      type: object
      required: [nom, type, personnalisable, specifications]
      properties:
        nom: { type: string }
        type:
          type: string
          enum: [electrique, acoustique, basse, autre]
        inspiration: { type: ["string", "null"] }
        prix_base_eur: { type: ["number", "null"] }
        personnalisable: { type: boolean }
        specifications:
          $ref: "#/components/schemas/Specification"
    ProfilSonore:
      type: object
      properties:
        styles:
          type: array
          items: { type: string }
        niveau_sortie: { type: ["string", "null"] }
        chaleur: { type: ["number", "null"] }
        brillance: { type: ["number", "null"] }
        dynamique: { type: ["number", "null"] }
        type_grain: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
    Logistique:
      type: object
      properties:
        expedie_france: { type: boolean }
        expedie_europe: { type: boolean }
        expedie_monde: { type: boolean }
        transporteur: { type: ["string", "null"] }
        garantie_annees: { type: ["number", "null"] }
        politique_retour: { type: ["string", "null"] }
    Innovation:
      type: object
      properties:
        niveau: { type: ["number", "null"] }
        materiaux_alternatifs:
          type: array
          items: { type: string }
        demarche_ecologique: { type: ["string", "null"] }
        technologie_proprietaire: { type: ["string", "null"] }
        edition_limitee: { type: boolean }
        marqueurs:
          type: array
          items: { type: string }
    IaMetadata:
      type: object
      properties:
        tags:
          type: array
          items: { type: string }
        mots_cles:
          type: array
          items: { type: string }
        resume_ia: { type: ["string", "null"] }
        modele_utilise: { type: ["string", "null"] }
        genere_le: { type: ["string", "null"] }
    Fiche:
      type: object
      required: [slug, nom, type, modeles, profil_sonore, logistique, innovation, ia, statut, demonstration]
      properties:
        slug: { type: string }
        nom: { type: string }
        type:
          type: string
          enum: [luthier, marque_emergente]
        annee_creation: { type: ["number", "null"] }
        pays: { type: ["string", "null"] }
        ville: { type: ["string", "null"] }
        site_web: { type: ["string", "null"] }
        reseaux:
          type: object
          additionalProperties: { type: string }
        expedition_internationale: { type: boolean }
        delai_moyen_mois: { type: ["number", "null"] }
        prix_min_eur: { type: ["number", "null"] }
        prix_max_eur: { type: ["number", "null"] }
        production_annuelle: { type: ["number", "null"] }
        approche_artisanale: { type: ["string", "null"] }
        score_originalite: { type: ["number", "null"] }
        score_innovation: { type: ["number", "null"] }
        modeles:
          type: array
          items: { $ref: "#/components/schemas/Modele" }
        profil_sonore:
          $ref: "#/components/schemas/ProfilSonore"
        logistique:
          $ref: "#/components/schemas/Logistique"
        innovation:
          $ref: "#/components/schemas/Innovation"
        ia:
          $ref: "#/components/schemas/IaMetadata"
        statut:
          type: string
          enum: [candidate, a_verifier, a_suivre, trop_etablie, rejetee, publiee]
        source_donnees:
          type: array
          items: { type: string }
        valide_par_artisan: { type: boolean }
        verification_identite_le: { type: ["string", "null"] }
        demonstration: { type: boolean }
        cree_le: { type: ["string", "null"] }
        maj_le: { type: ["string", "null"] }
    BriefInput:
      type: object
      required: [type_instrument, budget_min_eur, budget_max_eur, styles, bois_souhaites, zone_preferee, personnalisation, description_libre, consentement_transmission]
      properties:
        type_instrument:
          type: string
          enum: [electrique, acoustique, basse, autre]
        budget_min_eur: { type: number, minimum: 0, maximum: 200000 }
        budget_max_eur: { type: number, minimum: 0, maximum: 200000 }
        styles:
          type: array
          maxItems: 8
          items: { type: string }
        bois_souhaites:
          type: array
          maxItems: 8
          items: { type: string }
        delai_max_mois: { type: ["number", "null"], minimum: 0, maximum: 120 }
        pays_livraison: { type: ["string", "null"], maxLength: 60 }
        zone_preferee:
          type: string
          enum: [france, europe, monde]
        chaleur_souhaitee: { type: ["number", "null"], minimum: 0, maximum: 10 }
        brillance_souhaitee: { type: ["number", "null"], minimum: 0, maximum: 10 }
        innovation_recherchee: { type: ["number", "null"], minimum: 0, maximum: 10 }
        personnalisation: { type: boolean }
        description_libre: { type: string, maxLength: 1500 }
        email: { type: ["string", "null"], maxLength: 180, description: Required when consentement_transmission is true; otherwise it is not persisted. }
        consentement_transmission: { type: boolean, default: false, description: Explicitly authorizes creation of a private musician portal and transmission after acceptance. }
    Recommendation:
      type: object
      required: [slug, nom, type, correspondance, points_correspondance, points_vigilance, demonstration, valide_par_artisan]
      properties:
        slug: { type: string }
        nom: { type: string }
        type:
          type: string
          enum: [luthier, marque_emergente]
        ville: { type: ["string", "null"] }
        pays: { type: ["string", "null"] }
        prix_min_eur: { type: ["number", "null"] }
        prix_max_eur: { type: ["number", "null"] }
        delai_moyen_mois: { type: ["number", "null"] }
        site_web: { type: ["string", "null"] }
        demonstration: { type: boolean }
        valide_par_artisan: { type: boolean }
        correspondance: { type: number }
        points_correspondance:
          type: array
          items: { type: string }
        points_vigilance:
          type: array
          items: { type: string }
    RecommendationResponse:
      type: object
      required: [resume, origine_resume, resultats, avertissement]
      properties:
        resume: { type: string }
        origine_resume: { type: string }
        resultats:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
        avertissement: { type: string }
    BriefReceipt:
      type: object
      required: [reference, portail_musicien, recommandations]
      properties:
        reference: { type: string }
        portail_musicien: { type: ["string", "null"] }
        recommandations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
    FichesMeta:
      type: object
      required: [total_publiees, total_fiches, pays, types]
      properties:
        total_publiees: { type: number }
        total_fiches: { type: number }
        pays:
          type: array
          items: { type: string }
        types:
          type: object
          additionalProperties: { type: number }
    AdminSummary:
      type: object
      required: [compteurs, fiches, passerelle, acces]
      properties:
        compteurs:
          type: object
          additionalProperties: { type: number }
        fiches:
          type: array
          items: { $ref: "#/components/schemas/Fiche" }
        passerelle: { type: string }
        acces:
          $ref: "#/components/schemas/AccessAdminSummary"
    StatusUpdate:
      type: object
      required: [statut]
      properties:
        statut:
          type: string
          enum: [candidate, a_verifier, a_suivre, trop_etablie, rejetee, publiee]
    AccessPlan:
      type: string
      enum: [essentiel, atelier, signature]
      description: essentiel includes 1 follow-up credit, atelier 2, and signature 3.
    AtelierSessionInput:
      type: object
      properties:
        code_demo: { type: string, maxLength: 80 }
    AtelierSession:
      type: object
      required: [session, atelier_slug, expire_le]
      properties:
        session: { type: string }
        atelier_slug: { type: string }
        expire_le: { type: string, format: date-time }
    AtelierActionInput:
      type: object
      required: [session]
      properties:
        session: { type: string, minLength: 20 }
    AtelierAccessRequestInput:
      type: object
      required: [session, reference_projet, offre]
      properties:
        session: { type: string, minLength: 20 }
        reference_projet: { type: string }
        offre:
          $ref: "#/components/schemas/AccessPlan"
    MusicianDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accepter, refuser]
    AtelierProject:
      type: object
      required: [reference, type_instrument, budget_min_eur, budget_max_eur, styles, cree_le]
      properties:
        reference: { type: string }
        type_instrument: { type: string }
        budget_min_eur: { type: number }
        budget_max_eur: { type: number }
        styles:
          type: array
          items: { type: string }
        description: { type: ["string", "null"] }
        cree_le: { type: string }
    AtelierAccessRequest:
      type: object
      required: [id, reference_projet, atelier_slug, atelier_nom, offre, montant_eur, statut, statut_paiement, cree_le, credits_relance]
      properties:
        id: { type: number }
        reference_projet: { type: string }
        atelier_slug: { type: string }
        atelier_nom: { type: string }
        offre:
          $ref: "#/components/schemas/AccessPlan"
        montant_eur: { type: number }
        statut:
          type: string
          enum: [en_attente, acceptee, refusee, annulee, expiree]
        statut_paiement:
          type: string
          enum: [preautorise, encaisse, annule]
        cree_le: { type: string, format: date-time }
        decide_le: { type: ["string", "null"], format: date-time }
        expire_le: { type: ["string", "null"], format: date-time }
        credits_relance: { type: number, minimum: 0, maximum: 3 }
        derniere_relance_le: { type: ["string", "null"], format: date-time }
        projet:
          $ref: "#/components/schemas/AtelierProject"
    AtelierDashboard:
      type: object
      required: [atelier_slug, atelier_nom, places_restantes, demandes, carnets]
      properties:
        atelier_slug: { type: string }
        atelier_nom: { type: string }
        places_restantes: { type: number, minimum: 0, maximum: 3 }
        demandes:
          type: array
          items:
            $ref: "#/components/schemas/AtelierAccessRequest"
        carnets:
          type: array
          items:
            $ref: "#/components/schemas/AtelierAccessRequest"
    MusicianProject:
      type: object
      required: [reference, statut, type_instrument, budget_min_eur, budget_max_eur, styles, cree_le, demandes, courriel_confirmation]
      properties:
        reference: { type: string }
        statut:
          type: string
          enum: [actif, sommeil]
        type_instrument: { type: string }
        budget_min_eur: { type: number }
        budget_max_eur: { type: number }
        styles:
          type: array
          items: { type: string }
        description: { type: ["string", "null"] }
        cree_le: { type: string }
        courriel_confirmation: { type: string }
        demandes:
          type: array
          items:
            $ref: "#/components/schemas/AtelierAccessRequest"
    AccessAdminSummary:
      type: object
      required: [en_attente, acceptees, expirees, preautorisations, encaissements]
      properties:
        en_attente: { type: number }
        acceptees: { type: number }
        expirees: { type: number }
        preautorisations: { type: number }
        encaissements: { type: number }
    AccessMaintenanceResult:
      type: object
      required: [annulations, expirations, relances, projets_sommeil, execute_le]
      properties:
        annulations: { type: number }
        expirations: { type: number }
        relances: { type: number }
        projets_sommeil: { type: number }
        execute_le: { type: string }

