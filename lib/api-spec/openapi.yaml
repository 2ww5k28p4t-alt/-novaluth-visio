openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API publique de NovaLuth
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: directory
    description: Public directory of makers
  - name: recommendations
    description: Instrument matching engine
  - name: briefs
    description: Musician project briefs
  - name: admin
    description: Moderation and curation
  - name: atelier-access
    description: Atelier access requests and musician project decisions
  - name: protected-orders
    description: Protected custom-order lifecycle and simulated payments
  - name: meet
    description: Peer-to-peer video rooms and signaling configuration
  - name: transparency
    description: Public provider and data-processing transparency
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /meet/config:
    get:
      operationId: getMeetConfig
      tags: [meet]
      summary: Get the P2P Meet room configuration
      responses:
        "200":
          description: Public room limits and access requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetConfig"
  /meet/auth/session:
    get:
      operationId: getMeetAuthSession
      tags: [meet]
      summary: Get the current NovaLuth Meet account session
      responses:
        "200":
          description: Current account, or an anonymous session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetAuthSession"
  /meet/auth/login:
    post:
      operationId: loginMeetAccount
      tags: [meet]
      summary: Open a NovaLuth Meet account session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetAuthLogin"
      responses:
        "200":
          description: Authenticated Meet account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetAuthSession"
        "401":
          description: Invalid or disabled account
  /meet/auth/logout:
    post:
      operationId: logoutMeetAccount
      tags: [meet]
      summary: Close the current NovaLuth Meet account session
      responses:
        "204":
          description: Session closed
  /meet/ice:
    get:
      operationId: getMeetIceConfig
      tags: [meet]
      summary: Get the browser ICE configuration for P2P Meet
      responses:
        "200":
          description: Ephemeral STUN/TURN configuration without server secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetIceConfig"
  /sante:
    get:
      operationId: getGatewayHealth
      tags: [transparency]
      summary: Get the sanitized gateway health state
      description: Shows configuration presence and quotas without exposing keys.
      responses:
        "200":
          description: Gateway health state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayHealth"
  /transparence:
    get:
      operationId: getTransparency
      tags: [transparency]
      summary: Get public provider and source transparency
      responses:
        "200":
          description: Named provider chains and privacy commitments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transparency"
  /v1/etat:
    get:
      operationId: getProviderState
      tags: [transparency]
      summary: Get the public provider registry state
      responses:
        "200":
          description: Sanitized provider registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderState"
  /fiches:
    get:
      operationId: listFiches
      tags: [directory]
      summary: List published makers
      parameters:
        - name: pays
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [luthier, marque_emergente]
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: instrument
          in: query
          required: false
          schema:
            type: string
            enum: [electrique, acoustique, basse, autre]
        - name: style
          in: query
          required: false
          schema:
            type: string
        - name: couleur_son
          in: query
          required: false
          schema:
            type: string
            enum: [chaud, equilibre, clair]
        - name: zone
          in: query
          required: false
          schema:
            type: string
            enum: [france, europe, monde]
        - name: budget_eur
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: delai_max_mois
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: relue_seulement
          in: query
          required: false
          schema:
            type: boolean
        - name: facons
          in: query
          required: false
          description: Comma-separated working-method keys from the closed directory vocabulary.
          schema:
            type: string
        - name: tri
          in: query
          required: false
          schema:
            type: string
            enum: [equitable, delai, budget, alpha, maj]
        - name: statut
          in: query
          required: false
          schema:
            type: string
            enum:
              [publiee, candidate, a_verifier, a_suivre, trop_etablie, rejetee]
            default: publiee
      responses:
        "200":
          description: Matching directory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fiche"
  /fiches/meta:
    get:
      operationId: getFichesMeta
      tags: [directory]
      summary: Get directory summary and available filters
      responses:
        "200":
          description: Directory summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FichesMeta"
  /fiches/{slug}:
    get:
      operationId: getFiche
      tags: [directory]
      summary: Get one published maker
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Maker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fiche"
        "404":
          description: Maker not found
  /recommend:
    post:
      operationId: recommend
      tags: [recommendations]
      summary: Match a musician brief with published makers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefInput"
      responses:
        "200":
          description: Recommendations with explanations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "422":
          description: Invalid brief
  /briefs:
    post:
      operationId: createBrief
      tags: [briefs]
      summary: Save a musician project brief without sharing it unless consent is explicit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefInput"
      responses:
        "201":
          description: Brief saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefReceipt"
        "422":
          description: Invalid brief
        "400":
          description: A consented project requires an email address for its private portal
  /projets/{reference}/portail/{token}:
    get:
      operationId: getMusicianProject
      tags: [atelier-access]
      summary: Get a musician project using its private portal link
      parameters:
        - $ref: "#/components/parameters/ProjectReference"
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Musician project and access requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicianProject"
        "404":
          description: Project or private link not found
  /projets/{reference}/portail/{token}/demandes/{requestId}/decision:
    post:
      operationId: decideMusicianAccessRequest
      tags: [atelier-access]
      summary: Accept or refuse an atelier access request
      description: >
        Only the musician holding the private portal link can decide. An accepted request
        captures its preauthorization and opens a five-day access pass; a refusal releases it.
      parameters:
        - $ref: "#/components/parameters/ProjectReference"
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: requestId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MusicianDecisionInput"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAccessRequest"
        "404":
          description: Project or request not found
        "409":
          description: Request was already decided
  /ateliers/{slug}/session:
    post:
      operationId: openAtelierSession
      tags: [atelier-access]
      summary: Open a limited demonstration session for an atelier
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierSessionInput"
      responses:
        "200":
          description: Limited atelier session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierSession"
        "404":
          description: Atelier not found
  /ateliers/{slug}/tableau-de-bord:
    get:
      operationId: getAtelierDashboard
      tags: [atelier-access]
      summary: Get atelier requests, credits and access passes
      security:
        - atelierSession: []
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
      responses:
        "200":
          description: Atelier dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierDashboard"
        "401":
          description: Invalid session
  /ateliers/{slug}/projets:
    get:
      operationId: listAtelierProjects
      tags: [atelier-access]
      summary: List compatible projects available to an atelier
      security:
        - atelierSession: []
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
      responses:
        "200":
          description: Compatible musician projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtelierProject"
        "401":
          description: Invalid session
  /ateliers/{slug}/demandes:
    post:
      operationId: createAtelierAccessRequest
      tags: [atelier-access]
      summary: Request access to a compatible musician project
      description: >
        Creates a pending request with a payment preauthorization only. Project details stay
        hidden until the musician accepts. An atelier may hold at most three pending requests
        or active access passes.
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierAccessRequestInput"
      responses:
        "201":
          description: Preauthorized access request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAccessRequest"
        "400":
          description: Request cannot be created
  /ateliers/{slug}/demandes/{requestId}/annulation:
    post:
      operationId: cancelAtelierAccessRequest
      tags: [atelier-access]
      summary: Cancel a pending request and release its authorization
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
        - name: requestId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierActionInput"
      responses:
        "200":
          description: Cancelled request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAccessRequest"
  /ateliers/{slug}/carnets/{requestId}/relance:
    post:
      operationId: useAtelierFollowupCredit
      tags: [atelier-access]
      summary: Use one follow-up credit on an active, captured access pass
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
        - name: requestId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierActionInput"
      responses:
        "200":
          description: Updated access pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtelierAccessRequest"
        "400":
          description: Access has expired, has not been accepted, or has no remaining credit
  /ateliers/{slug}/commandes:
    get:
      operationId: listProtectedOrders
      tags: [protected-orders]
      summary: List protected orders for an atelier
      security:
        - atelierSession: []
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
      responses:
        "200":
          description: Protected orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProtectedOrder"
        "401":
          description: Invalid atelier session
    post:
      operationId: createProtectedOrder
      tags: [protected-orders]
      summary: Declare a protected custom order
      description: >
        Declaring an order never charges the atelier. The musician receives a private
        confirmation link valid for seven days.
      security:
        - atelierSession: []
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtectedOrderInput"
      responses:
        "201":
          description: Declared protected order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedOrderCreated"
        "400":
          description: Order cannot be declared
        "401":
          description: Invalid atelier session
  /ateliers/{slug}/commandes/{orderId}/annulation:
    post:
      operationId: cancelProtectedOrderByAtelier
      tags: [protected-orders]
      summary: Cancel a protected order as the atelier
      security:
        - atelierSession: []
      parameters:
        - $ref: "#/components/parameters/AtelierSlug"
        - $ref: "#/components/parameters/ProtectedOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtelierActionInput"
      responses:
        "200":
          description: Cancelled protected order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedOrder"
        "400":
          description: Order cannot be cancelled
        "401":
          description: Invalid atelier session
        "404":
          description: Order not found
  /commandes/{reference}/confirmation/{token}:
    get:
      operationId: getProtectedOrder
      tags: [protected-orders]
      summary: Get a protected order using the musician confirmation link
      parameters:
        - $ref: "#/components/parameters/ProtectedOrderReference"
        - $ref: "#/components/parameters/ProtectedOrderToken"
      responses:
        "200":
          description: Protected order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedOrder"
        "404":
          description: Link not found or expired
  /commandes/{reference}/confirmation/{token}/decision:
    post:
      operationId: decideProtectedOrder
      tags: [protected-orders]
      summary: Confirm or refuse a protected order
      parameters:
        - $ref: "#/components/parameters/ProtectedOrderReference"
        - $ref: "#/components/parameters/ProtectedOrderToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtectedOrderDecisionInput"
      responses:
        "200":
          description: Updated protected order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedOrderDecisionResponse"
        "400":
          description: Order already decided or expired
        "404":
          description: Link not found
        "409":
          description: Order was updated concurrently
  /commandes/{reference}/confirmation/{token}/annulation:
    post:
      operationId: cancelProtectedOrderByMusician
      tags: [protected-orders]
      summary: Cancel a confirmed protected order as the musician
      parameters:
        - $ref: "#/components/parameters/ProtectedOrderReference"
        - $ref: "#/components/parameters/ProtectedOrderToken"
      responses:
        "200":
          description: Cancelled protected order and generated atelier credit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedOrder"
        "400":
          description: Order cannot be cancelled
        "404":
          description: Link not found
  /commandes/{reference}/livraison/{token}:
    get:
      operationId: getProtectedDelivery
      tags: [protected-orders]
      summary: Get a protected order using its delivery link
      parameters:
        - $ref: "#/components/parameters/ProtectedOrderReference"
        - $ref: "#/components/parameters/ProtectedOrderToken"
      responses:
        "200":
          description: Delivery confirmation view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedOrder"
        "404":
          description: Delivery link not found
  /commandes/{reference}/livraison/{token}/reception:
    post:
      operationId: confirmProtectedDelivery
      tags: [protected-orders]
      summary: Confirm receipt and capture the capped commission
      parameters:
        - $ref: "#/components/parameters/ProtectedOrderReference"
        - $ref: "#/components/parameters/ProtectedOrderToken"
      responses:
        "200":
          description: Delivered protected order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedOrder"
        "400":
          description: Delivery cannot be confirmed
        "404":
          description: Delivery link not found
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get moderation queue summary
      security:
        - adminToken: []
      responses:
        "200":
          description: Moderation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          description: Missing or invalid admin token
  /admin/prospection/dossiers:
    get:
      operationId: listProspectionDossiers
      tags: [admin]
      summary: List prospecting files for human review
      security:
        - meetSession: []
      responses:
        "200":
          description: Prospecting files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectionDossierList"
        "401":
          description: Authenticated administrator account required
  /admin/prospection/dossiers/{dossierId}:
    get:
      operationId: getProspectionDossier
      tags: [admin]
      summary: Get a prospecting file and its active proposal
      security:
        - meetSession: []
      parameters:
        - $ref: "#/components/parameters/ProspectionDossierId"
      responses:
        "200":
          description: Prospecting file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectionDossierDetail"
        "401": { description: Authenticated administrator account required }
        "404": { description: Prospecting file not found }
    patch:
      operationId: correctProspectionDossier
      tags: [admin]
      summary: Correct reviewable prospecting fields
      security:
        - meetSession: []
      parameters:
        - $ref: "#/components/parameters/ProspectionDossierId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectionCorrection"
      responses:
        "200":
          description: Corrected file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectionDossierDetail"
        "401": { description: Authenticated administrator account required }
        "404": { description: Prospecting file not found }
        "409": { description: File changed since it was displayed }
  /admin/prospection/dossiers/{dossierId}/validate:
    post:
      operationId: validateProspectionProposal
      tags: [admin]
      summary: Human-validate a proposal without allowing delivery
      security:
        - meetSession: []
      parameters:
        - $ref: "#/components/parameters/ProspectionDossierId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectionValidation"
      responses:
        "200":
          description: Validated proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectionDossierDetail"
        "400": { description: Proposal cannot be validated }
        "401": { description: Authenticated administrator account required }
        "404": { description: Prospecting file not found }
        "409": { description: File changed or already has an active proposal }
  /admin/prospection/dossiers/{dossierId}/withdraw:
    post:
      operationId: withdrawProspectionProposal
      tags: [admin]
      summary: Withdraw an active proposal
      security:
        - meetSession: []
      parameters:
        - $ref: "#/components/parameters/ProspectionDossierId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectionConfirmation"
      responses:
        "200":
          description: File after withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectionDossierDetail"
        "401": { description: Authenticated administrator account required }
        "404": { description: Active proposal not found }
        "409": { description: File changed since it was displayed }
  /admin/prospection/dossiers/{dossierId}/mark:
    post:
      operationId: markProspectionDossier
      tags: [admin]
      summary: Manually record a prospecting outcome
      security:
        - meetSession: []
      parameters:
        - $ref: "#/components/parameters/ProspectionDossierId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectionManualMark"
      responses:
        "200":
          description: Manually updated file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectionDossierDetail"
        "400": { description: Transition not allowed }
        "401": { description: Authenticated administrator account required }
        "404": { description: Prospecting file not found }
        "409": { description: File changed since it was displayed }
  /admin/meet/accounts:
    get:
      operationId: listMeetAccounts
      tags: [admin]
      summary: List NovaLuth Meet accounts
      security:
        - adminToken: []
      responses:
        "200":
          description: Meet accounts without password material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetAccountList"
        "401":
          description: Missing or invalid administrator credentials
    post:
      operationId: createMeetAccount
      tags: [admin]
      summary: Create a NovaLuth Meet account and generate a temporary password
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetAccount"
      responses:
        "201":
          description: Account created; the temporary password is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetAccountCredential"
        "400":
          description: Invalid account details
        "401":
          description: Missing or invalid administrator credentials
        "409":
          description: Login already exists
  /admin/meet/accounts/{accountId}:
    patch:
      operationId: updateMeetAccount
      tags: [admin]
      summary: Enable or disable a NovaLuth Meet account
      security:
        - adminToken: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeetAccount"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetAccount"
        "400":
          description: Invalid account state
        "401":
          description: Missing or invalid administrator credentials
        "404":
          description: Account not found
  /admin/meet/accounts/{accountId}/reset-password:
    post:
      operationId: resetMeetAccountPassword
      tags: [admin]
      summary: Reset an account password without storing it in clear text
      security:
        - adminToken: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: New temporary password, returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetAccountCredential"
        "401":
          description: Missing or invalid administrator credentials
        "404":
          description: Account not found
  /admin/sn13/purge/incidents:
    get:
      operationId: getSn13PurgeIncidents
      tags: [admin]
      summary: List recent SN13 purge incidents
      security:
        - adminToken: []
      responses:
        "200":
          description: Recent SN13 purge outage and recovery episodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sn13PurgeIncidentHistory"
        "401":
          description: Missing or invalid admin token
  /admin/fiches/{slug}/status:
    patch:
      operationId: updateFicheStatus
      tags: [admin]
      summary: Change a maker profile status
      security:
        - adminToken: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fiche"
        "401":
          description: Missing or invalid admin token
        "404":
          description: Maker not found
  /admin/acces/entretien:
    post:
      operationId: runAccessMaintenance
      tags: [admin]
      summary: Run the daily access expiration and reminder maintenance
      security:
        - adminToken: []
      responses:
        "200":
          description: Maintenance results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessMaintenanceResult"
        "401":
          description: Missing or invalid admin token
components:
  parameters:
    ProspectionDossierId:
      name: dossierId
      in: path
      required: true
      schema: { type: string, minLength: 36, maxLength: 36 }
    AtelierSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    ProjectReference:
      name: reference
      in: path
      required: true
      schema: { type: string }
    ProtectedOrderReference:
      name: reference
      in: path
      required: true
      schema: { type: string, pattern: "^CMD-[A-Z0-9]+$" }
    ProtectedOrderToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 32, maxLength: 100 }
    ProtectedOrderId:
      name: orderId
      in: path
      required: true
      schema: { type: number }
  securitySchemes:
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
    atelierSession:
      type: apiKey
      in: header
      name: X-NovaLuth-Atelier-Session
    meetSession:
      type: apiKey
      in: cookie
      name: novaluth_meet_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MeetConfig:
      type: object
      required: [maxPeers, accessCodeRequired, forceRelay, authRequired]
      properties:
        maxPeers: { type: number }
        accessCodeRequired: { type: boolean }
        forceRelay: { type: boolean }
        authRequired: { type: boolean }
    MeetAccount:
      type: object
      required: [id, login, displayName, role, atelierSlug, active, mustChangePassword, createdAt, lastLoginAt]
      properties:
        id: { type: number }
        login: { type: string }
        displayName: { type: string }
        role:
          type: string
          enum: [admin, artisan, musicien]
        atelierSlug: { type: ["string", "null"] }
        active: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: ["string", "null"], format: date-time }
    MeetAuthSession:
      type: object
      required: [authenticated, account]
      properties:
        authenticated: { type: boolean }
        account:
          oneOf:
            - $ref: "#/components/schemas/MeetAccount"
            - type: "null"
    MeetAuthLogin:
      type: object
      required: [login, password]
      properties:
        login: { type: string, minLength: 3, maxLength: 80 }
        password: { type: string, minLength: 1, maxLength: 200 }
    CreateMeetAccount:
      type: object
      required: [login, displayName, role]
      properties:
        login: { type: string, minLength: 3, maxLength: 80 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        role:
          type: string
          enum: [admin, artisan, musicien]
        atelierSlug: { type: ["string", "null"], maxLength: 120 }
    UpdateMeetAccount:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    MeetAccountList:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/MeetAccount" }
    MeetAccountCredential:
      type: object
      required: [account, temporaryPassword]
      properties:
        account: { $ref: "#/components/schemas/MeetAccount" }
        temporaryPassword: { type: string }
    MeetIceServer:
      type: object
      required: [urls]
      properties:
        urls:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        username: { type: ["string", "null"] }
        credential: { type: ["string", "null"] }
    MeetIceConfig:
      type: object
      required:
        [iceServers, iceTransportPolicy, iceCandidatePoolSize, bundlePolicy, rtcpMuxPolicy, warning]
      properties:
        iceServers:
          type: array
          items:
            $ref: "#/components/schemas/MeetIceServer"
        iceTransportPolicy:
          type: string
          enum: [all, relay]
        iceCandidatePoolSize: { type: number }
        bundlePolicy:
          type: string
          enum: [balanced, max-compat, max-bundle]
        rtcpMuxPolicy:
          type: string
          enum: [negotiate, require]
        warning: { type: ["string", "null"] }
    Provider:
      type: object
      required:
        [
          cle,
          nom,
          reseau,
          netuid,
          tarif,
          source,
          licence,
          reserve,
          configure,
          modeles,
        ]
      properties:
        cle: { type: string }
        nom: { type: string }
        reseau:
          type: string
          enum: [local, classique, bittensor]
        netuid: { type: ["number", "null"] }
        tarif: { type: string }
        source: { type: string }
        licence: { type: string }
        reserve: { type: string }
        configure: { type: boolean }
        modeles:
          type: array
          items: { type: string }
    ProviderChains:
      type: object
      required: [inference, recherche, lecture, collecte]
      properties:
        inference:
          type: array
          items: { $ref: "#/components/schemas/Provider" }
        recherche:
          type: array
          items: { $ref: "#/components/schemas/Provider" }
        lecture:
          type: array
          items: { $ref: "#/components/schemas/Provider" }
        collecte:
          type: array
          items: { $ref: "#/components/schemas/Provider" }
    ProviderState:
      type: object
      required: [besoins, hors_production, principes, modeles_autorises]
      properties:
        besoins:
          $ref: "#/components/schemas/ProviderChains"
        hors_production:
          type: array
          items: { type: string }
        principes:
          type: array
          items: { type: string }
        modeles_autorises:
          type: array
          items: { type: string }
    GatewayHealth:
      type: object
      required:
        [
          service,
          secret_interne,
          cles_presentes,
          chaines_actives,
          modeles_autorises,
          plafonds,
        ]
      properties:
        service: { type: string }
        secret_interne: { type: boolean }
        cles_presentes:
          type: object
          additionalProperties: { type: boolean }
        chaines_actives:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        modeles_autorises:
          type: array
          items: { type: string }
        plafonds:
          type: object
          required:
            [
              ia_par_jour,
              collecte_par_jour,
              recherches_par_jour,
              pages_par_jour,
            ]
          properties:
            ia_par_jour: { type: number }
            collecte_par_jour: { type: number }
            recherches_par_jour: { type: number }
            pages_par_jour: { type: number }
    Transparency:
      allOf:
        - $ref: "#/components/schemas/ProviderState"
        - type: object
          required: [titre, mise_a_jour, engagement, donnees]
          properties:
            titre: { type: string }
            mise_a_jour: { type: string }
            engagement: { type: string }
            donnees:
              type: array
              items: { type: string }
    Specification:
      type: object
      properties:
        bois_corps: { type: ["string", "null"] }
        bois_manche: { type: ["string", "null"] }
        touche: { type: ["string", "null"] }
        profil_manche: { type: ["string", "null"] }
        diapason_mm: { type: ["number", "null"] }
        nombre_cases: { type: ["number", "null"] }
        type_micros: { type: ["string", "null"] }
        configuration_micros: { type: ["string", "null"] }
        chevalet: { type: ["string", "null"] }
        poids_kg: { type: ["number", "null"] }
    Modele:
      type: object
      required: [nom, type, personnalisable, specifications]
      properties:
        nom: { type: string }
        type:
          type: string
          enum: [electrique, acoustique, basse, autre]
        inspiration: { type: ["string", "null"] }
        prix_base_eur: { type: ["number", "null"] }
        personnalisable: { type: boolean }
        specifications:
          $ref: "#/components/schemas/Specification"
    ProfilSonore:
      type: object
      properties:
        styles:
          type: array
          items: { type: string }
        niveau_sortie: { type: ["string", "null"] }
        couleur:
          type: ["string", "null"]
          enum: [chaud, equilibre, clair, null]
        attaque:
          type: ["string", "null"]
          enum: [douce, franche, percussive, null]
        tenue:
          type: ["string", "null"]
          enum: [courte, moyenne, longue, null]
        type_grain: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
    Logistique:
      type: object
      properties:
        expedie_france: { type: boolean }
        expedie_europe: { type: boolean }
        expedie_monde: { type: boolean }
        transporteur: { type: ["string", "null"] }
        garantie_annees: { type: ["number", "null"] }
        politique_retour: { type: ["string", "null"] }
    Innovation:
      type: object
      properties:
        materiaux_alternatifs:
          type: array
          items: { type: string }
        demarche_ecologique: { type: ["string", "null"] }
        technologie_proprietaire: { type: ["string", "null"] }
        edition_limitee: { type: boolean }
        marqueurs:
          type: array
          items: { type: string }
    IaMetadata:
      type: object
      properties:
        tags:
          type: array
          items: { type: string }
        mots_cles:
          type: array
          items: { type: string }
        resume_ia: { type: ["string", "null"] }
        modele_utilise: { type: ["string", "null"] }
        genere_le: { type: ["string", "null"] }
    Fiche:
      type: object
      required:
        [
          slug,
          nom,
          type,
          modeles,
          profil_sonore,
          logistique,
          innovation,
          ia,
          statut,
          demonstration,
          facons_travail,
          provenance_facons,
        ]
      properties:
        slug: { type: string }
        nom: { type: string }
        type:
          type: string
          enum: [luthier, marque_emergente]
        annee_creation: { type: ["number", "null"] }
        pays: { type: ["string", "null"] }
        ville: { type: ["string", "null"] }
        site_web: { type: ["string", "null"] }
        reseaux:
          type: object
          additionalProperties: { type: string }
        expedition_internationale: { type: boolean }
        delai_moyen_mois: { type: ["number", "null"] }
        prix_min_eur: { type: ["number", "null"] }
        prix_max_eur: { type: ["number", "null"] }
        production_annuelle: { type: ["number", "null"] }
        approche_artisanale: { type: ["string", "null"] }
        modeles:
          type: array
          items: { $ref: "#/components/schemas/Modele" }
        profil_sonore:
          $ref: "#/components/schemas/ProfilSonore"
        logistique:
          $ref: "#/components/schemas/Logistique"
        innovation:
          $ref: "#/components/schemas/Innovation"
        ia:
          $ref: "#/components/schemas/IaMetadata"
        statut:
          type: string
          enum:
            [candidate, a_verifier, a_suivre, trop_etablie, rejetee, publiee]
        source_donnees:
          type: array
          items: { type: string }
        valide_par_artisan: { type: boolean }
        verification_identite_le: { type: ["string", "null"] }
        demonstration: { type: boolean }
        cree_le: { type: ["string", "null"] }
        maj_le: { type: ["string", "null"] }
        facons_travail:
          type: array
          items: { type: string }
        provenance_facons: { type: string }
    BriefInput:
      type: object
      required:
        [
          type_instrument,
          budget_min_eur,
          budget_max_eur,
          styles,
          bois_souhaites,
          zone_preferee,
          personnalisation,
          description_libre,
          consentement_transmission,
        ]
      properties:
        type_instrument:
          type: string
          enum: [electrique, acoustique, basse, autre]
        budget_min_eur: { type: number, minimum: 0, maximum: 200000 }
        budget_max_eur: { type: number, minimum: 0, maximum: 200000 }
        styles:
          type: array
          maxItems: 8
          items: { type: string }
        bois_souhaites:
          type: array
          maxItems: 8
          items: { type: string }
        delai_max_mois: { type: ["number", "null"], minimum: 0, maximum: 120 }
        pays_livraison: { type: ["string", "null"], maxLength: 60 }
        zone_preferee:
          type: string
          enum: [france, europe, monde]
        couleur_souhaitee:
          type: ["string", "null"]
          enum: [chaud, equilibre, clair, null]
        attaque_souhaitee:
          type: ["string", "null"]
          enum: [douce, franche, percussive, null]
        tenue_souhaitee:
          type: ["string", "null"]
          enum: [courte, moyenne, longue, null]
        facons_recherchees:
          type: array
          maxItems: 21
          items: { type: string }
        personnalisation: { type: boolean }
        description_libre: { type: string, maxLength: 1500 }
        email:
          {
            type: ["string", "null"],
            maxLength: 180,
            description: Required when consentement_transmission is true; otherwise it is not persisted.,
          }
        consentement_transmission:
          {
            type: boolean,
            default: false,
            description: Explicitly authorizes creation of a private musician portal and transmission after acceptance.,
          }
    Recommendation:
      type: object
      required:
        [
          slug,
          nom,
          type,
          correspondance,
          points_correspondance,
          points_vigilance,
          demonstration,
          valide_par_artisan,
        ]
      properties:
        slug: { type: string }
        nom: { type: string }
        type:
          type: string
          enum: [luthier, marque_emergente]
        ville: { type: ["string", "null"] }
        pays: { type: ["string", "null"] }
        prix_min_eur: { type: ["number", "null"] }
        prix_max_eur: { type: ["number", "null"] }
        delai_moyen_mois: { type: ["number", "null"] }
        site_web: { type: ["string", "null"] }
        demonstration: { type: boolean }
        valide_par_artisan: { type: boolean }
        correspondance: { type: number }
        points_correspondance:
          type: array
          items: { type: string }
        points_vigilance:
          type: array
          items: { type: string }
    RecommendationResponse:
      type: object
      required: [resume, origine_resume, resultats, avertissement]
      properties:
        resume: { type: string }
        origine_resume: { type: string }
        resultats:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
        avertissement: { type: string }
    BriefReceipt:
      type: object
      required: [reference, portail_musicien, courriel_envoye, recommandations]
      properties:
        reference: { type: string }
        portail_musicien: { type: ["string", "null"] }
        courriel_envoye:
          type: boolean
          description: Indicates whether the private portal email was accepted by the transactional email provider.
        recommandations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
    Facette:
      type: object
      required: [cle, libelle, aide]
      properties:
        cle: { type: string }
        libelle: { type: string }
        aide: { type: string }
    FamilleFacettes:
      type: object
      required: [cle, titre, cases]
      properties:
        cle: { type: string }
        titre: { type: string }
        cases:
          type: array
          items: { $ref: "#/components/schemas/Facette" }
    FichesMeta:
      type: object
      required:
        [
          total_publiees,
          total_fiches,
          pays,
          types,
          styles,
          facettes,
          couleurs_son,
        ]
      properties:
        total_publiees: { type: number }
        total_fiches: { type: number }
        pays:
          type: array
          items: { type: string }
        types:
          type: object
          additionalProperties: { type: number }
        styles:
          type: array
          items: { type: string }
        facettes:
          type: array
          items: { $ref: "#/components/schemas/FamilleFacettes" }
        couleurs_son:
          type: array
          items:
            type: object
            required: [cle, libelle]
            properties:
              cle: { type: string }
              libelle: { type: string }
    AdminSummary:
      type: object
      required: [compteurs, fiches, passerelle, collecte_sn13, purge_sn13, acces, commandes]
      properties:
        compteurs:
          type: object
          additionalProperties: { type: number }
        fiches:
          type: array
          items: { $ref: "#/components/schemas/Fiche" }
        passerelle: { type: string }
        collecte_sn13:
          $ref: "#/components/schemas/Sn13CallState"
        purge_sn13:
          $ref: "#/components/schemas/Sn13PurgeAdminState"
        acces:
          $ref: "#/components/schemas/AccessAdminSummary"
        commandes:
          $ref: "#/components/schemas/ProtectedOrderAdminSummary"
    ProspectionProposal:
      type: object
      required: [id, kind, subject, body, validated_at, withdrawn_at, delivery_allowed]
      properties:
        id: { type: string }
        kind: { type: string, enum: [first_contact, follow_up] }
        subject: { type: string }
        body: { type: string }
        validated_at: { type: string }
        withdrawn_at: { type: ["string", "null"] }
        delivery_allowed: { type: boolean }
    ProspectionDossierSummary:
      type: object
      required: [id, workshop_name, slug, state, revision, opened_at, has_active_proposal]
      properties:
        id: { type: string }
        workshop_name: { type: string }
        slug: { type: string }
        state: { type: string }
        revision: { type: number }
        opened_at: { type: string }
        has_active_proposal: { type: boolean }
    ProspectionDossierList:
      type: object
      required: [dossiers]
      properties:
        dossiers:
          type: array
          items: { $ref: "#/components/schemas/ProspectionDossierSummary" }
    ProspectionDossierDetail:
      type: object
      required: [id, workshop_name, slug, website_url, contact_email, contact_first_name, state, hook, hook_origin, verified_signals, revision, opened_at, proposal]
      properties:
        id: { type: string }
        workshop_name: { type: string }
        slug: { type: string }
        website_url: { type: ["string", "null"] }
        contact_email: { type: ["string", "null"] }
        contact_first_name: { type: ["string", "null"] }
        state: { type: string }
        hook: { type: ["string", "null"] }
        hook_origin: { type: ["string", "null"] }
        verified_signals:
          type: array
          items: { type: string }
        revision: { type: number }
        opened_at: { type: string }
        proposal:
          anyOf:
            - $ref: "#/components/schemas/ProspectionProposal"
            - type: "null"
    ProspectionCorrection:
      type: object
      required: [revision]
      properties:
        revision: { type: number, minimum: 0 }
        contact_email: { type: ["string", "null"], maxLength: 320 }
        contact_first_name: { type: ["string", "null"], maxLength: 100 }
        hook: { type: ["string", "null"], maxLength: 2000 }
        hook_origin: { type: ["string", "null"], enum: [signals, human, ai, null] }
        subject: { type: ["string", "null"], minLength: 10, maxLength: 200 }
        body: { type: ["string", "null"], minLength: 200, maxLength: 8000 }
    ProspectionValidation:
      type: object
      required: [revision, subject, body]
      properties:
        revision: { type: number, minimum: 0 }
        subject: { type: string, minLength: 10, maxLength: 200 }
        body: { type: string, minLength: 200, maxLength: 8000 }
    ProspectionConfirmation:
      type: object
      required: [revision, confirmed]
      properties:
        revision: { type: number, minimum: 0 }
        confirmed: { type: boolean, enum: [true] }
    ProspectionManualMark:
      type: object
      required: [revision, confirmed, state]
      properties:
        revision: { type: number, minimum: 0 }
        confirmed: { type: boolean, enum: [true] }
        state:
          type: string
          enum: [sent, replied, enrolled, declined, no_reply, abandoned]
    Sn13CallState:
      type: object
      required: [statut, requete_id, corps_erreur, appele_le, nombre, recents]
      properties:
        statut:
          type: string
          enum: [jamais, succes, vide, incomplet, erreur]
        requete_id: { type: ["string", "null"] }
        corps_erreur: { type: ["string", "null"] }
        appele_le: { type: ["string", "null"] }
        nombre: { type: ["number", "null"] }
        recents:
          $ref: "#/components/schemas/Sn13RecentStats"
    Sn13RecentStats:
      type: object
      required: [fenetre_heures, total, succes, vide, incomplet, erreur, alerte]
      properties:
        fenetre_heures: { type: number }
        total: { type: number }
        succes: { type: number }
        vide: { type: number }
        incomplet: { type: number }
        erreur: { type: number }
        alerte: { type: boolean }
    Sn13PurgeAdminState:
      type: object
      required: [statut, episode_actif, episode_commence_le, retabli_le]
      properties:
        statut: { type: string, enum: [sain, erreur] }
        episode_actif: { type: boolean }
        episode_commence_le: { type: ["string", "null"] }
        retabli_le: { type: ["string", "null"] }
    Sn13PurgeIncidentHistory:
      type: object
      required: [incidents]
      properties:
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/Sn13PurgeIncident"
    Sn13PurgeIncident:
      type: object
      required: [statut, commence_le, retabli_le, duree_secondes]
      properties:
        statut:
          type: string
          enum: [en_cours, retabli]
        commence_le: { type: string }
        retabli_le: { type: ["string", "null"] }
        duree_secondes: { type: number }
    StatusUpdate:
      type: object
      required: [statut]
      properties:
        statut:
          type: string
          enum:
            [candidate, a_verifier, a_suivre, trop_etablie, rejetee, publiee]
    AccessPlan:
      type: string
      enum: [essentiel, atelier, signature]
      description: essentiel includes 1 follow-up credit, atelier 2, and signature 3.
    ProtectedOrderDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [confirmer, refuser]
    ProtectedOrderInput:
      type: object
      required:
        [session, email_musicien, email_atelier, prix_instrument_eur]
      properties:
        session: { type: string, minLength: 20 }
        email_musicien: { type: string, minLength: 3, maxLength: 320 }
        email_atelier: { type: string, minLength: 3, maxLength: 320 }
        prix_instrument_eur: { type: number, exclusiveMinimum: 0, maximum: 10000000 }
        acompte_eur: { type: number, minimum: 0, maximum: 10000000 }
        reference_devis: { type: ["string", "null"], maxLength: 120 }
